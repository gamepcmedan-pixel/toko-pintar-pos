name: Build APK Toko Pintar POS Native
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract native Android source
        run: |
          unzip -oq "Toko-Pintar-Native-v2.0-Build-GitHub.zip" "app/*" -d .
          test -f app/src/main/AndroidManifest.xml

      - name: Configure Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK Platform 35
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(command -v sdkmanager)"
          fi
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0"

      - name: Configure Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compile genuine APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Toko-Pintar-POS-Native-v2-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

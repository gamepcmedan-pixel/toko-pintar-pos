name: Build APK Toko Pintar POS Native
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract native Android source from ZIP
        run: |
          unzip -oq "Toko-Pintar-Native-v2.0-Build-GitHub.zip" "app/*" -d .
          test -f app/src/main/AndroidManifest.xml

      - name: Configure Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Configure Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compile APK with Android Gradle Plugin
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Upload signed debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Toko-Pintar-POS-Native-v2-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

name: Build APK Toko Pintar POS Native v2.2
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract native Android source
        run: |
          unzip -oq "Toko-Pintar-Native-v2.0-Build-GitHub.zip" "app/*" -d .
          test -f app/src/main/AndroidManifest.xml

      - name: Apply POS v2.1 Bluetooth and auto-cart fixes
        run: python3 scripts/patch-v21.py

      - name: Apply POS v2.2 scanner and printer fixes
        run: |
          python3 - <<'PY'
          import base64,zlib,pathlib
          packed=pathlib.Path("scripts/v22.patch.zlib.b64").read_text().strip()
          patch=zlib.decompress(base64.b64decode(packed))
          pathlib.Path("v22.patch").write_bytes(patch)
          print("Decoded v2.2 patch:",len(patch),"bytes")
          PY
          patch -p1 --batch --forward < v22.patch
          grep -q "com.tokopintar.nativepos.v22" app/build.gradle

      - name: Configure Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK Platform 35
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(command -v sdkmanager)"
          fi
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0"

      - name: Configure Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Normalize OCR source newline
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path("app/src/main/java/com/tokopintar/nativepos/MainActivity.java")
          s=p.read_text()
          broken="recognized.trim().replace(" + chr(39) + chr(10) + chr(39) + ",' ')"
          fixed="recognized.trim().replace((char)10, ' ')"
          if broken not in s:
              raise RuntimeError("Expected OCR newline source not found")
          p.write_text(s.replace(broken,fixed))
          PY

      - name: Align Kotlin dependencies required by offline OCR
        run: |
          cat >> app/build.gradle <<'GRADLE'
          configurations.configureEach {
              resolutionStrategy.force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22', 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22'
          }
          GRADLE

      - name: Compile genuine APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Toko-Pintar-POS-Native-v2.2-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
